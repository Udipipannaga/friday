name: friday
x-app: &app
  build: .
  env_file: .env
  environment:
    FRIDAY_DATABASE_URL: postgresql+psycopg://friday:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/friday
    FRIDAY_REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: friday
      POSTGRES_DB: friday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friday -d friday"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    command: ["uvicorn", "friday.api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
  worker:
    <<: *app
    command: ["celery", "-A", "friday.tasks", "worker", "--loglevel=WARNING", "--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scheduler:
    <<: *app
    command: ["celery", "-A", "friday.tasks", "beat", "--loglevel=WARNING", "--schedule=/tmp/friday-beat"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
